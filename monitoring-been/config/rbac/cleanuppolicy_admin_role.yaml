# This rule is not used by the project monitoring-been itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cleanup.cloudclub.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: monitoring-been
    app.kubernetes.io/managed-by: kustomize
  name: cleanuppolicy-admin-role
rules:
- apiGroups:
  - cleanup.cloudclub.com
  resources:
  - cleanuppolicies
  verbs:
  - '*'
- apiGroups:
  - cleanup.cloudclub.com
  resources:
  - cleanuppolicies/status
  verbs:
  - get
