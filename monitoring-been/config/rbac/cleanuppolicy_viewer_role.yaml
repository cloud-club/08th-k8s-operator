# This rule is not used by the project monitoring-been itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cleanup.cloudclub.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: monitoring-been
    app.kubernetes.io/managed-by: kustomize
  name: cleanuppolicy-viewer-role
rules:
- apiGroups:
  - cleanup.cloudclub.com
  resources:
  - cleanuppolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cleanup.cloudclub.com
  resources:
  - cleanuppolicies/status
  verbs:
  - get
