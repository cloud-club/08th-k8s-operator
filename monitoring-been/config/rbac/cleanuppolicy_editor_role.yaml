# This rule is not used by the project monitoring-been itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cleanup.cloudclub.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: monitoring-been
    app.kubernetes.io/managed-by: kustomize
  name: cleanuppolicy-editor-role
rules:
- apiGroups:
  - cleanup.cloudclub.com
  resources:
  - cleanuppolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cleanup.cloudclub.com
  resources:
  - cleanuppolicies/status
  verbs:
  - get
